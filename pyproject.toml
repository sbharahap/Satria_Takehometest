[project]
name = "multi-agent-document-chatbot"
version = "0.1.0"
description = "Document-grounded assistants with isolated knowledge and configurable LLM providers."
requires-python = ">=3.11,<3.13"
dependencies = [
    "chromadb>=1.0,<2",
    "httpx>=0.28,<1",
    "langgraph>=1.0,<2",
    "litellm>=1.80,<2",
    "openai>=2.0,<3",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6.0,<7",
    "python-docx>=1.2,<2",
    "sentence-transformers>=5.0,<6",
    "scikit-learn>=1.7,<2",
    "streamlit>=1.50,<2",
    "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# CPU inference avoids downloading CUDA libraries in the demo container.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

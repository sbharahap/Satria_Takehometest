services:
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
